name: Xtensa Rust | rust-src

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Xtensa Rust release version to build"
        required: true
        default: '1.98.0.0'
      source_ref:
        description: "d9beuD/esp-rust source ref to build"
        required: true
      release_tag:
        description: "Existing release tag where artifacts will be published"
        required: false
        default: "v1.98.0.0"

permissions:
  contents: write

jobs:
  get_release:
    name: Get release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.get_upload_url.outputs.url }}
    steps:
      - name: get upload url
        id: get_upload_url
        run: |
          if url=$(gh api "repos/d9beuD/esp-rust-build/releases/tags/${{ github.event.inputs.release_tag }}" --jq .upload_url 2>/dev/null); then
            echo "url=$url" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-xtensa-rust:
    name: Build Xtensa rust-src
    needs: get_release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        include:
          - os: ubuntu-latest
            ASSET_PATH: "rust/build/dist/rust-src-nightly.tar.xz"
            ASSET_NAME: "rust-src-${{ github.event.inputs.release_version }}.tar.xz"
            ASSET_CONTENT_TYPE: "application/x-tar"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          repository: d9beuD/esp-rust
          ref: ${{ github.event.inputs.source_ref }}
          submodules: true
          path: "rust"
      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@master
      - name: Configure Rust project
        working-directory: rust
        run: |
          python3 src/bootstrap/configure.py --experimental-targets=Xtensa --release-channel=nightly --release-description="${{ github.event.inputs.release_version }}" --enable-extended --dist-compression-formats='xz'
      - name: Build Rust src dist
        working-directory: rust
        run: |
          python3 x.py dist rust-src
      - name: Record source provenance
        working-directory: rust
        run: |
          cp build/dist/rust-src-nightly.tar.xz "../rust-src-${{ github.event.inputs.release_version }}.tar.xz"
          commit=$(git rev-parse HEAD)
          printf '{"tag":"%s","version":"%s","source":{"repository":"https://github.com/d9beuD/esp-rust.git","commit":"%s"},"host":"rust-src","ci":"success"}\n' "${{ github.event.inputs.release_tag }}" "${{ github.event.inputs.release_version }}" "$commit" > ../evidence.json
          sha256sum "../rust-src-${{ github.event.inputs.release_version }}.tar.xz" > ../SHA256SUMS
      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-src-${{ github.run_id }}
          path: |
            rust-src-${{ github.event.inputs.release_version }}.tar.xz
            evidence.json
            SHA256SUMS
      - name: Upload Release Asset
        if: needs.get_release.outputs.upload_url != ''
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.get_release.outputs.upload_url }}
          asset_path: rust-src-${{ github.event.inputs.release_version }}.tar.xz
          asset_name: ${{ matrix.ASSET_NAME }}
          asset_content_type: ${{ matrix.ASSET_CONTENT_TYPE }}
      - name: Upload evidence
        if: needs.get_release.outputs.upload_url != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.get_release.outputs.upload_url }}
          asset_path: evidence.json
          asset_name: evidence.json
          asset_content_type: application/json
      - name: Upload checksums
        if: needs.get_release.outputs.upload_url != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.get_release.outputs.upload_url }}
          asset_path: SHA256SUMS
          asset_name: SHA256SUMS
          asset_content_type: text/plain
