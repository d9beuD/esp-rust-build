name: Xtensa Rust | x86_64-unknown-linux-gnu
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Xtensa Rust release version to build"
        required: true
        default: "1.98.0.0"
      source_ref:
        description: "d9beuD/esp-rust source ref to build"
        required: true
      release_tag:
        description: "Existing release tag where artifacts will be published"
        required: false
        default: "v1.98.0.0"

permissions:
  contents: write

jobs:
  get_release:
    name: Get release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.get_upload_url.outputs.url }}
    steps:
      - name: get upload url
        id: get_upload_url
        run: |
          if url=$(gh api "repos/d9beuD/esp-rust-build/releases/tags/${{ github.event.inputs.release_tag }}" --jq .upload_url 2>/dev/null); then
            echo "url=$url" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-xtensa-rust:
    name: Build Xtensa Rust
    needs: get_release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - ASSET_NAME: "rust-${{ github.event.inputs.release_version }}-x86_64-unknown-linux-gnu.tar.xz"
            ASSET_CONTENT_TYPE: "application/x-tar"
    steps:
      - name: Verify x86_64 runner
        run: |
          test "$(uname -m)" = x86_64
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Checkout d9beuD/esp-rust provenance source
        uses: actions/checkout@v6
        with:
          repository: d9beuD/esp-rust
          ref: ${{ github.event.inputs.source_ref }}
          path: rust
      - name: Build construction container
        run: |
          cd support/rust-build/x86_64-unknown-linux-gnu
          docker build -f Containerfile -t ubuntu-builder  .
      - name: Build Rust
        run: |
          docker run -e RELEASE_VERSION='${{ github.event.inputs.release_version }}' -e SOURCE_REF='${{ github.event.inputs.source_ref }}' --name rust-linux ubuntu-builder ./build.sh
          mkdir -p build
          docker cp rust-linux:/home/rust/rust/build/dist build/dist
      - name: Prepare release assets and provenance
        run: |
          shopt -s nullglob
          archives=(build/dist/rust-*-x86_64-unknown-linux-gnu.tar.xz)
          if [ "${#archives[@]}" -ne 1 ]; then
            printf 'expected one stage2 host archive, found %s\n' "${#archives[@]}" >&2
            exit 1
          fi
          stage_version=${archives[0]#build/dist/rust-}
          stage_version=${stage_version%-x86_64-unknown-linux-gnu.tar.xz}
          source_archive="build/dist/rust-src-${stage_version}.tar.xz"
          test -f "$source_archive"
          mv "${archives[0]}" "rust-${{ github.event.inputs.release_version }}-x86_64-unknown-linux-gnu.tar.xz"
          mv "$source_archive" "rust-src-${{ github.event.inputs.release_version }}.tar.xz"
          commit=$(git -C rust rev-parse HEAD)
          printf '{"tag":"%s","version":"%s","source":{"repository":"https://github.com/d9beuD/esp-rust.git","commit":"%s"},"host":"x86_64-unknown-linux-gnu","ci":"success"}\n' "${{ github.event.inputs.release_tag }}" "${{ github.event.inputs.release_version }}" "$commit" > evidence.json
          sha256sum "rust-${{ github.event.inputs.release_version }}-x86_64-unknown-linux-gnu.tar.xz" "rust-src-${{ github.event.inputs.release_version }}.tar.xz" > SHA256SUMS
      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x86_64-unknown-linux-gnu-${{ github.run_id }}
          path: |
            rust-${{ github.event.inputs.release_version }}-x86_64-unknown-linux-gnu.tar.xz
            rust-src-${{ github.event.inputs.release_version }}.tar.xz
            SHA256SUMS
            evidence.json
      - name: Upload Release Asset
        if: needs.get_release.outputs.upload_url != ''
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.get_release.outputs.upload_url }}
          asset_path: rust-${{ github.event.inputs.release_version }}-x86_64-unknown-linux-gnu.tar.xz
          asset_name: ${{ matrix.ASSET_NAME }}
          asset_content_type: ${{ matrix.ASSET_CONTENT_TYPE }}
      - name: Upload source, checksums, and evidence
        if: needs.get_release.outputs.upload_url != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.get_release.outputs.upload_url }}
          asset_path: rust-src-${{ github.event.inputs.release_version }}.tar.xz
          asset_name: rust-src-${{ github.event.inputs.release_version }}.tar.xz
          asset_content_type: application/x-tar
      - uses: actions/upload-release-asset@v1
        if: needs.get_release.outputs.upload_url != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.get_release.outputs.upload_url }}
          asset_path: SHA256SUMS
          asset_name: SHA256SUMS
          asset_content_type: text/plain
      - uses: actions/upload-release-asset@v1
        if: needs.get_release.outputs.upload_url != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.get_release.outputs.upload_url }}
          asset_path: evidence.json
          asset_name: evidence.json
          asset_content_type: application/json
      - name: Clean up
        run: |
          docker container rm rust-linux
          rm -rf build
