name: Xtensa Rust | aarch64-apple-darwin

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Xtensa Rust release version to build"
        required: true
        default: '1.98.0.0'
      source_ref:
        description: "d9beuD/esp-rust source ref to build"
        required: true
      release_tag:
        description: "Existing release tag where artifacts will be published"
        required: false
        default: "v1.98.0.0"

permissions:
  contents: write

jobs:
  get_release:
    name: Get release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.get_upload_url.outputs.url }}
    steps:
      - name: get upload url
        id: get_upload_url
        run: |
          if url=$(gh api "repos/d9beuD/esp-rust-build/releases/tags/${{ github.event.inputs.release_tag }}" --jq .upload_url 2>/dev/null); then
            echo "url=$url" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-xtensa-rust:
    name: Build Xtensa Rust
    needs: get_release
    runs-on: macos-14
    strategy:
      matrix:
        include:
          - ASSET_NAME: "rust-${{ github.event.inputs.release_version }}-aarch64-apple-darwin.tar.xz"
            ASSET_CONTENT_TYPE: "application/x-tar"
    steps:
      - name: Verify ARM64 runner
        run: test "$(uname -m)" = arm64
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          repository: d9beuD/esp-rust
          ref: ${{ github.event.inputs.source_ref }}
          submodules: true
      - name: Prepare build
        run: |
          arch -arm64 python3 src/bootstrap/configure.py --experimental-targets=Xtensa --release-channel=nightly --release-description="${{ github.event.inputs.release_version }}" --enable-extended --enable-cargo-native-static --tools=rustdoc,clippy,cargo,rustfmt,rust-analyzer-proc-macro-srv,src --dist-compression-formats='xz' --set rust.jemalloc --enable-lld --enable-profiler
      - name: Build with x.py - dist packages - with cached LLVM
        run: |
          arch -arm64 python3 x.py dist --stage 2 rustc rust-std cargo clippy rustfmt rust-src
          find build/dist -mindepth 1 -maxdepth 2 -print | sort
          bash support/rust-build/assemble-host-toolchain.sh build/dist aarch64-apple-darwin '${{ github.event.inputs.release_version }}'
      - name: Prepare release assets and provenance
        run: |
          shopt -s nullglob
          archives=(build/dist/rust-*-aarch64-apple-darwin.tar.xz)
          host_archives=()
          for archive in "${archives[@]}"; do [[ "$archive" == build/dist/rust-std-* ]] || host_archives+=("$archive"); done
          archives=("${host_archives[@]}")
          if [ "${#archives[@]}" -ne 1 ]; then
            printf 'expected one stage2 host archive, found %s\n' "${#archives[@]}" >&2
            exit 1
          fi
          source_archives=(build/dist/rust-src-*.tar.xz)
          test "${#source_archives[@]}" -eq 1
          mv "${archives[0]}" "rust-${{ github.event.inputs.release_version }}-aarch64-apple-darwin.tar.xz"
          mv "${source_archives[0]}" "rust-src-${{ github.event.inputs.release_version }}.tar.xz"
          commit=$(git rev-parse HEAD)
          printf '{"tag":"%s","version":"%s","source":{"repository":"https://github.com/d9beuD/esp-rust.git","commit":"%s"},"host":"aarch64-apple-darwin","ci":"success"}\n' "${{ github.event.inputs.release_tag }}" "${{ github.event.inputs.release_version }}" "$commit" > evidence.json
          if command -v sha256sum >/dev/null; then
            sha256sum "rust-${{ github.event.inputs.release_version }}-aarch64-apple-darwin.tar.xz" "rust-src-${{ github.event.inputs.release_version }}.tar.xz" > SHA256SUMS
          else
            shasum -a 256 "rust-${{ github.event.inputs.release_version }}-aarch64-apple-darwin.tar.xz" "rust-src-${{ github.event.inputs.release_version }}.tar.xz" > SHA256SUMS
          fi
      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aarch64-apple-darwin-${{ github.run_id }}
          path: |
            rust-${{ github.event.inputs.release_version }}-aarch64-apple-darwin.tar.xz
            rust-src-${{ github.event.inputs.release_version }}.tar.xz
            SHA256SUMS
            evidence.json
      - name: Upload Release Asset
        if: needs.get_release.outputs.upload_url != ''
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.get_release.outputs.upload_url }}
          asset_path: rust-${{ github.event.inputs.release_version }}-aarch64-apple-darwin.tar.xz
          asset_name: ${{ matrix.ASSET_NAME }}
          asset_content_type: ${{ matrix.ASSET_CONTENT_TYPE }}
      - name: Upload source, checksums, and evidence
        if: needs.get_release.outputs.upload_url != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.get_release.outputs.upload_url }}
          asset_path: rust-src-${{ github.event.inputs.release_version }}.tar.xz
          asset_name: rust-src-${{ github.event.inputs.release_version }}.tar.xz
          asset_content_type: application/x-tar
      - uses: actions/upload-release-asset@v1
        if: needs.get_release.outputs.upload_url != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.get_release.outputs.upload_url }}
          asset_path: SHA256SUMS
          asset_name: SHA256SUMS
          asset_content_type: text/plain
      - uses: actions/upload-release-asset@v1
        if: needs.get_release.outputs.upload_url != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.get_release.outputs.upload_url }}
          asset_path: evidence.json
          asset_name: evidence.json
          asset_content_type: application/json
