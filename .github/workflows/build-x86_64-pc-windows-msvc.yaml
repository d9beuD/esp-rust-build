name: Xtensa Rust | x86_64-pc-windows-msvc

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Xtensa Rust release version to build"
        required: true
        default: '1.98.0.0'
      source_ref:
        description: "d9beuD/esp-rust source ref to build"
        required: true
      release_tag:
        description: "Existing release tag where artifacts will be published"
        required: false
        default: "v1.98.0.0"

permissions:
  contents: write

jobs:
  get_release:
    name: Get release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.get_upload_url.outputs.url }}
    steps:
      - name: get upload url
        id: get_upload_url
        run: |
          if url=$(gh api "repos/d9beuD/esp-rust-build/releases/tags/${{ github.event.inputs.release_tag }}" --jq .upload_url 2>/dev/null); then
            echo "url=$url" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-xtensa-rust:
    name: Build Xtensa Rust
    needs: get_release
    runs-on: windows-2022
    steps:
      - name: Verify x86_64 runner
        shell: powershell
        run: |
          if (-not [Environment]::Is64BitOperatingSystem -or $env:PROCESSOR_ARCHITECTURE -ne 'AMD64') { throw 'x86_64 runner required' }
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Checkout repository - d9beuD/esp-rust
        uses: actions/checkout@v6
        with:
          path: rust
          repository: d9beuD/esp-rust
          ref: ${{ github.event.inputs.source_ref }}
          submodules: true
      - name: Unmount local drive
        id: unount_path_before
        shell: powershell
        run: if (subst | Select-String -Quiet 'R:') { subst "R:" /D }
      - name: Map local long path to new drive
        id: map_path
        shell: powershell
        run: subst "R:" "$env:GITHUB_WORKSPACE\rust"
      - name: Prepare build
        working-directory: "R:"
        shell: powershell
        run: |
          python src/bootstrap/configure.py --experimental-targets=Xtensa --release-channel=nightly --release-description="${{ github.event.inputs.release_version }}" --enable-extended --tools=rustdoc,clippy,cargo,rustfmt,rust-analyzer-proc-macro-srv,analysis,rust-analysis,src --dist-compression-formats='xz' --enable-lld --enable-profiler
      - name: Build with x.py - dist packages
        working-directory: "R:"
        shell: powershell
        run: |
          python x.py dist --stage 2 rust-src
      - name: Repackage binary
        shell: powershell
        working-directory: "R:/build/dist"
        run: |
          &"$env:GITHUB_WORKSPACE/support/rust-build/Repackage-RustRelease.ps1" -DefaultHost x86_64-pc-windows-msvc -ReleaseVersion "${{ github.event.inputs.release_version }}"
      - name: Prepare release assets and provenance
        shell: bash
        run: |
          cp "rust/build/dist/rust-${{ github.event.inputs.release_version }}-x86_64-pc-windows-msvc.zip" "rust-${{ github.event.inputs.release_version }}-x86_64-pc-windows-msvc.zip"
          shopt -s nullglob
          source_archives=(rust/build/dist/rust-src-*.tar.xz)
          if [ "${#source_archives[@]}" -ne 1 ]; then
            printf 'expected one stage2 source archive, found %s\n' "${#source_archives[@]}" >&2
            exit 1
          fi
          mv "${source_archives[0]}" "rust-src-${{ github.event.inputs.release_version }}.tar.xz"
          commit=$(git -C rust rev-parse HEAD)
          printf '{"tag":"%s","version":"%s","source":{"repository":"https://github.com/d9beuD/esp-rust.git","commit":"%s"},"host":"x86_64-pc-windows-msvc","ci":"success"}\n' "${{ github.event.inputs.release_tag }}" "${{ github.event.inputs.release_version }}" "$commit" > evidence.json
          sha256sum "rust-${{ github.event.inputs.release_version }}-x86_64-pc-windows-msvc.zip" "rust-src-${{ github.event.inputs.release_version }}.tar.xz" > SHA256SUMS
      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x86_64-pc-windows-msvc-${{ github.run_id }}
          path: |
            rust-${{ github.event.inputs.release_version }}-x86_64-pc-windows-msvc.zip
            rust-src-${{ github.event.inputs.release_version }}.tar.xz
            SHA256SUMS
            evidence.json
      - name: Upload Release Asset
        if: needs.get_release.outputs.upload_url != ''
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.get_release.outputs.upload_url }}
          asset_path: rust-${{ github.event.inputs.release_version }}-x86_64-pc-windows-msvc.zip
          asset_name: rust-${{ github.event.inputs.release_version }}-x86_64-pc-windows-msvc.zip
          asset_content_type: application/x-tar
      - name: Upload source, checksums, and evidence
        if: needs.get_release.outputs.upload_url != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.get_release.outputs.upload_url }}
          asset_path: rust-src-${{ github.event.inputs.release_version }}.tar.xz
          asset_name: rust-src-${{ github.event.inputs.release_version }}.tar.xz
          asset_content_type: application/x-tar
      - uses: actions/upload-release-asset@v1
        if: needs.get_release.outputs.upload_url != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.get_release.outputs.upload_url }}
          asset_path: SHA256SUMS
          asset_name: SHA256SUMS
          asset_content_type: text/plain
      - uses: actions/upload-release-asset@v1
        if: needs.get_release.outputs.upload_url != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.get_release.outputs.upload_url }}
          asset_path: evidence.json
          asset_name: evidence.json
          asset_content_type: application/json
      - name: Unmount local drive
        id: unount_path
        shell: powershell
        run: if (subst | Select-String -Quiet 'R:') { subst "R:" /D }
